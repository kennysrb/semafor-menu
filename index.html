<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Semafor Caffe</title>
  <style>
    :root {
      --bg:       #0d1b2a;
      --surface:  #112236;
      --gold:     #c9a84c;
      --cream:    #e8dcc8;
      --muted:    #7a8fa6;
      --tab-bg:   #0a1520;
      --red:      #e03535;
      --amber:    #e8a020;
      --green:    #2e9e5b;
      --header-h: 110px;
      --tabbar-h: 64px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
    }
  </style>
</head>
